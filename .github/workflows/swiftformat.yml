name: Code style check

on: [push]

jobs:
  check:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'
    - name: Install SwiftFromat
      run: brew install swiftformat
    - name: Check SwiftFromat
      run: swiftformat . --lint

