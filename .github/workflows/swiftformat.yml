name: Code style check

on: [push]

jobs:
  check:

    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode 16.4
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
    - name: Check SwiftFromat
      run: swift run swiftformat . --lint

